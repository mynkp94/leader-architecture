];

var S, best=SAVED.best||0, cur=null, busy=false;
var top=document.getElementById('top'), card=document.getElementById('card'), choice=document.getElementById('choice'), info=document.getElementById('info');
var fills=[], dots=[];
M.forEach(function(m){
  var d=document.createElement('div'); d.className='m';
  d.innerHTML='<div class="dot"><i></i></div><div class="ic">'+m[0]+'</div><div class="nm">'+m[1]+'</div><div class="bar"><div class="fill"></div></div>';
  top.appendChild(d); fills.push(d.querySelector('.fill')); dots.push(d.querySelector('.dot i'));
});

function save(){ window.__save={best:best,state:(S&&!S.over)?S:null}; try{localStorage.setItem('kts-truong-save',JSON.stringify(window.__save));}catch(_){} }
function clamp(x){return Math.max(0,Math.min(100,x));}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function newGame(){ S={v:[50,50,50,50],week:0,q:[],recent:[],intro:0,over:null}; }
function meters(){
  S.v.forEach(function(x,k){ fills[k].style.width=x+'%'; fills[k].classList.toggle('warn',x<=20||x>=80); });
  info.textContent='Tuần '+S.week+'  ·  Kỷ lục '+best;
}
function preview(e){
  dots.forEach(function(d,k){
    var a=e?Math.abs(e[k]):0, s=a===0?0:(a>=10?11:6);
    d.style.width=s+'px'; d.style.height=s+'px';
  });
}
function pick(){
  if(!S.intro){ S.intro=1; return INTRO; }
  for(var i=0;i<S.q.length;i++){ if(S.q[i].due<=S.week){ var id=S.q.splice(i,1)[0].id; return FOLLOW[id]; } }
  var need=[]; S.v.forEach(function(x,k){ if(x<=20) need.push([k,0]); else if(x>=80) need.push([k,1]); });
  if(need.length && Math.random()<0.5){
    var n=rnd(need);
    var f=FIX.filter(function(z){return z.m===n[0]&&z.s===n[1]&&S.recent.indexOf(z.id)<0;});
    if(f.length) return rnd(f);
  }
  var pool=MAIN.filter(function(z){return S.recent.indexOf(z.id)<0;});
  if(!pool.length){ S.recent=[]; pool=MAIN; }
  return rnd(pool);
}
function show(){
  cur=pick();
  document.getElementById('cic').textContent=cur.ic;
  document.getElementById('cname').textContent=cur.who;
  document.getElementById('ctext').textContent=cur.t;
  choice.style.opacity=0; preview(null);
  card.style.transition='none'; card.style.transform='translateX(0) rotate(0deg)'; card.style.opacity=0;
  void card.offsetWidth;
  card.style.transition='opacity .25s ease'; card.style.opacity=1;
  busy=false; save();
}
function finish(k,side){
  S.over={k:k,s:side};
  var isNew=S.week>best;
  best=Math.max(best,S.week);
  var e=END[k][side];
  document.getElementById('oh').textContent=e[0];
  document.getElementById('op').textContent=e[1];
  document.getElementById('os').textContent='Bạn điều hành công ty được '+S.week+' tuần'+(isNew?' (kỷ lục mới)':'')+'.';
  document.getElementById('over').style.display='flex';
  save();
}
function apply(side){
  var ch=cur[side], e=ch[1], o=ch[2]||{};
  for(var k=0;k<4;k++) S.v[k]=clamp(S.v[k]+e[k]);
  if(o.next) S.q.push({id:o.next[0],due:S.week+o.next[1]});
  S.week++;
  S.recent.push(cur.id); if(S.recent.length>14) S.recent.shift();
  meters();
  for(var j=0;j<4;j++){
    if(S.v[j]<=0){ finish(j,0); return; }
    if(S.v[j]>=100){ finish(j,1); return; }
  }
  show();
}
function commit(side){
  if(busy) return; busy=true;
  card.style.transition='transform .28s ease,opacity .28s ease';
  card.style.transform='translateX('+(side==='L'?-520:520)+'px) rotate('+(side==='L'?-28:28)+'deg)';
  card.style.opacity=0;
  setTimeout(function(){ apply(side); },270);
}
function move(x){
  card.style.transform='translateX('+x+'px) rotate('+(x/18)+'deg)';
  var side=x<0?'L':'R', a=Math.min(1,Math.abs(x)/90);
  choice.textContent=cur[side][0]; choice.style.opacity=a;
  preview(a>0.35?cur[side][1]:null);
}
function snap(){
  card.style.transition='transform .22s ease';
  card.style.transform='translateX(0) rotate(0deg)';
  choice.style.opacity=0; preview(null);
}
var dx=0,sx=0,drag=false;
card.addEventListener('pointerdown',function(e){ if(busy) return; drag=true; sx=e.clientX; dx=0; try{card.setPointerCapture(e.pointerId);}catch(_){} card.style.transition='none'; });
card.addEventListener('pointermove',function(e){ if(!drag) return; dx=e.clientX-sx; move(dx); });
function end(){ if(!drag) return; drag=false; if(Math.abs(dx)>110) commit(dx<0?'L':'R'); else snap(); dx=0; }
card.addEventListener('pointerup',end); card.addEventListener('pointercancel',end);
function tap(side){ if(busy) return; move(side==='L'?-120:120); setTimeout(function(){commit(side);},160); }
document.getElementById('bl').addEventListener('click',function(){tap('L');});
document.getElementById('br').addEventListener('click',function(){tap('R');});
document.addEventListener('keydown',function(e){ if(e.key==='ArrowLeft') tap('L'); if(e.key==='ArrowRight') tap('R'); });
document.getElementById('ob').addEventListener('click',function(){
  document.getElementById('over').style.display='none'; newGame(); meters(); show();
});

if(SAVED.state && SAVED.state.v && !SAVED.state.over){ S=SAVED.state; } else { newGame(); }
window.__game={get S(){return S;},get cur(){return cur;},tap:tap};
meters(); show();
})();
</script></body></html>
